experiment:
  name: exp271_ood_245_twitch_lodo_dim32
  out_root: experiments/ood/twitch

runtime:
  screen: false
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  free_mem_mib: 6500
  max_parallel: 1
  poll_seconds: 60

matrix:
  target_domain: [DE, EN, ES, FR, PT, RU]
  seed: [2710, 2711, 2712, 2713]

paths:
  out_dir_template: "{out_root}/{target_domain}/ougp_tta/seed{seed}"
  log_file_template: "{out_root}/logs/{target_domain}_seed{seed}.log"
  result_file: result.json
  job_id_template: twitch_{target_domain}_seed{seed}

job:
  entrypoint: scripts/twitch_lodo_experiment.py
  args:
    experiment_name: EXP271_TWITCH_LODO_OUGP_TTA_245_DIM32
    out_dir: "{out_dir}"
    data_root: data/raw
    method: ougp_tta
    target_domain: "{target_domain}"
    seed: "{seed}"
    device: cuda
    hidden_dim: 32
    epochs: 200
    warmup_epochs: 10
    tta_epochs: 100
    graph_sparsity: 0.30
    param_sparsity: 0.30
    lr: 0.05
    weight_decay: 0.0005
    latency_warmup: 0
    latency_repeats: 1

summary:
  entrypoint: scripts/summarize_twitch_lodo.py
  args:
    root: "{out_root}"
