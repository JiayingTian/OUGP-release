experiment:
  name: release_ood_citation_acm_to_dblp_para_tta
  out_root: experiments/ood/citation_acm_to_dblp_para_tta

runtime:
  screen: true
  screen_name: release_citation_acm_to_dblp_para_tta
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  free_mem_mib: 6500
  max_parallel: 1
  poll_seconds: 60

matrix:
  seed: [2710, 2711, 2712, 2713]

paths:
  out_dir_template: "{out_root}/seed{seed}"
  log_file_template: "{out_root}/logs/seed{seed}.log"
  result_file: ood_result.json
  job_id_template: citation_acm_to_dblp_seed{seed}

job:
  entrypoint: scripts/run_ood_citation_para_tta.py
  args:
    experiment_name: RELEASE_OOD_ACMV9_TO_DBLPV8_PARA_TTA
    out_dir: "{out_dir}"
    source_dataset: acm
    target_dataset: dblp
    data_root: data/raw/udagcn
    split_mode: stratified_2_1_1
    device: cuda
    seed: "{seed}"
    epochs: 200
    checkpoint_selection: best_val
    warmup_epochs: 10
    training_mask_mode: periodic_ste
    mask_hardening_interval: 1
    training_mask_hardening_mode: quantile_binary
    backbone: gcn
    num_gnn_layers: 2
    hidden_dim: 32
    graph_sparsity: 0.30
    param_sparsity: 0.30
    param_pruning_granularity: weight
    param_policy_granularity: channel
    use_hidden_coupling: true
    hidden_coupling_mix_graph: 0.30
    hidden_coupling_mix_param: 0.30
    memory_rank: 8
    graph_memory_layout: multi
    param_memory_layout: multi
    graph_score_init: topofeat
    param_score_init: magnitude
    lr: 0.05
    weight_decay: 0.0005
    sparsity_lambda: 0.08
    hardening_mode: quantile_binary
    include_dense_baseline: true
    source_checkpoint_policy: off
    profile_inference_repeats: 0
    profile_warmup: 0
    tta_protocol: para_tta
    para_tta_score_scale: 0.50
    para_tta_energy_gate: true
    para_tta_gate_temperature: 1.0
    para_tta_eps: 1e-6
    tta_epochs: 0
    tta_target_adaptation_epochs: 0
    tta_output_mlp: false
    tta_prediction_propagation: false
