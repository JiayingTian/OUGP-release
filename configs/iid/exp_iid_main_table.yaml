experiment:
  name: release_iid_para_tta
  out_root: experiments/iid_para_tta

runtime:
  screen: true
  screen_name: release_iid_para_tta
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  free_mem_mib: 6500
  max_parallel: 4
  poll_seconds: 30

matrix:
  case: [iid_cora, iid_pubmed, iid_cora_full, iid_dblp, iid_acm]
  seed: [6222, 8010, 5908, 8837]

paths:
  out_dir_template: "{out_root}/{case}/seed{seed}"
  log_file_template: "{out_root}/logs/{case}_seed{seed}.log"
  result_file: result.json
  job_id_template: "{case}_seed{seed}"

job:
  entrypoint: scripts/exp_entry_point.py
  args:
    case: "{case}"
    experiment_name: RELEASE_IID_PARA_TTA
    out_dir: "{out_dir}"
    split_mode: stratified_2_1_1
    device: cuda
    seed: "{seed}"
    epochs: 200
    checkpoint_selection: best_val
    warmup_epochs: 10
    training_mask_mode: periodic_ste
    mask_hardening_interval: 1
    training_mask_hardening_mode: quantile_binary
    backbone: gcn
    num_gnn_layers: 2
    hidden_dim: 32
    graph_sparsity: 0.30
    param_sparsity: 0.30
    param_pruning_granularity: weight
    param_policy_granularity: channel
    use_hidden_coupling: true
    hidden_coupling_mix_graph: 0.30
    hidden_coupling_mix_param: 0.30
    memory_rank: 8
    graph_memory_layout: multi
    param_memory_layout: multi
    graph_score_init: topofeat
    param_score_init: magnitude
    lr: 0.05
    weight_decay: 0.0005
    sparsity_lambda: 0.08
    hardening_mode: quantile_binary
    deployment_graph_policy: full
    latency_repeats: 1
    latency_warmup: 0
    include_dense_baseline: true
    source_checkpoint_policy: off

    tta_protocol: para_tta
    tta_test_mode: standard_affine
    para_tta_score_scale: 0.50
    para_tta_energy_gate: false
    para_tta_gate_temperature: 1.0
    para_tta_eps: 1e-6
    tta_epochs: 0
    tta_target_adaptation_epochs: 0
    tta_output_mlp: false
    tta_prediction_propagation: false

summary:
  entrypoint: scripts/summarize_tta_seed_sweep.py
  args:
    root: "{out_root}"
    output: "{out_root}/seed_sweep_summary.csv"
